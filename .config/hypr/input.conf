# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = intl
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        tap-to-click         = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
}

device {
    name = at-translated-set-2-keyboard
    kb_layout = br
    kb_variant =
}
