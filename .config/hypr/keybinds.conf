# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, N, exec, $notes
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, ~/.config/hypr/scripts/lock.sh
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/menu.sh power
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

bind = ALT, TAB, cyclenext,
bind = ALT, TAB, bringactivetotop,
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, bringactivetotop,

bind = $mainMod, slash, exec, ~/.config/hypr/scripts/cheatsheet.sh

bind = $mainMod, comma, exec, makoctl dismiss
bind = $mainMod SHIFT, comma, exec, makoctl dismiss -a
bind = $mainMod ALT, comma, exec, makoctl restore

bind = $mainMod CTRL, I, exec, ~/.config/hypr/scripts/toggle-idle.sh
bind = $mainMod ALT, W, exec, qs ipc call wallpaper next

bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lock.sh
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# Redimensionar janela
bind = $mainMod CTRL, h, resizeactive, -60 0
bind = $mainMod CTRL, l, resizeactive, 60 0
bind = $mainMod CTRL, k, resizeactive, 0 -60
bind = $mainMod CTRL, j, resizeactive, 0 60

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Switch workspaces — per-monitor quando dual monitor, normal quando monitor único
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/workspace.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/workspace.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/workspace.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/workspace.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/workspace.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/workspace.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/workspace.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/workspace.sh 10

# Move active window to a workspace — per-monitor quando dual monitor
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/moveworkspace.sh 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/moveworkspace.sh 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/moveworkspace.sh 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/moveworkspace.sh 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/moveworkspace.sh 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/moveworkspace.sh 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/moveworkspace.sh 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/moveworkspace.sh 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/moveworkspace.sh 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/moveworkspace.sh 10

# Mover janela entre monitores
bind = $mainMod SHIFT, h, movewindow, mon:l
bind = $mainMod SHIFT, l, movewindow, mon:r

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = , Print,       exec, grim - | wl-copy
bind = SHIFT, Print,  exec, grim -g "$(slurp)" - | wl-copy

bind = CTRL, Print,       exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = CTRL SHIFT, Print,  exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu --prompt "clip: " | cliphist decode | wl-copy
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod ALT, Print, exec, ~/.config/hypr/scripts/screenrecord.sh region
bind = $mainMod ALT, space, exec, ~/.config/hypr/scripts/menu.sh
bind = $mainMod CTRL, N, exec, ~/.config/hypr/scripts/nightlight.sh
