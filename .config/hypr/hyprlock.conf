source = ~/.config/hypr/lock-theme.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/b-145.jpg

    blur_passes = 3
    blur_size    = 8
    brightness   = 0.6
    contrast     = 1.0
    vibrancy     = 0.2
}

# Relógio
label {
    monitor =
    text     = cmd[update:1000] echo "$(date +"%H:%M")"
    color    = rgba($textff)
    font_size   = 90
    font_family = Hack Nerd Font

    position  = 0, 200
    halign    = center
    valign    = center
}

# Data
label {
    monitor =
    text     = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color    = rgba($subtextff)
    font_size   = 22
    font_family = Hack Nerd Font

    position  = 0, 100
    halign    = center
    valign    = center
}

# Campo de senha
input-field {
    monitor =
    size = 300, 50

    outline_thickness = 2
    dots_size         = 0.2
    dots_spacing      = 0.35

    outer_color  = rgba($accentff)
    inner_color  = rgba($baseff)
    font_color   = rgba($textff)   # text
    fade_on_empty = false

    placeholder_text = <span foreground="##$overlay"> Senha...</span>
    hide_input        = false

    check_color = rgba($greenff)
    fail_color  = rgba($redff)
    fail_text   = <i>Senha incorreta</i>

    position = 0, -100
    halign   = center
    valign   = center
}
