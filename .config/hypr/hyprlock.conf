# hyprlock — Catppuccin Mocha

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/b-145.jpg

    blur_passes = 3
    blur_size    = 8
    brightness   = 0.6
    contrast     = 1.0
    vibrancy     = 0.2
}

# Relógio
label {
    monitor =
    text     = cmd[update:1000] echo "$(date +"%H:%M")"
    color    = rgba(cdd6f4ff)
    font_size   = 90
    font_family = Hack Nerd Font

    position  = 0, 200
    halign    = center
    valign    = center
}

# Data
label {
    monitor =
    text     = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color    = rgba(bac2deff)
    font_size   = 22
    font_family = Hack Nerd Font

    position  = 0, 100
    halign    = center
    valign    = center
}

# Campo de senha
input-field {
    monitor =
    size = 300, 50

    outline_thickness = 2
    dots_size         = 0.2
    dots_spacing      = 0.35

    outer_color  = rgba(cba6f7ff)   # mauve
    inner_color  = rgba(1e1e2eff)   # base
    font_color   = rgba(cdd6f4ff)   # text
    fade_on_empty = false

    placeholder_text = <span foreground="##6c7086"> Senha...</span>
    hide_input        = false

    check_color = rgba(a6e3a1ff)    # green
    fail_color  = rgba(f38ba8ff)    # red
    fail_text   = <i>Senha incorreta</i>

    position = 0, -100
    halign   = center
    valign   = center
}
