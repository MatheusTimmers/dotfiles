# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  fullscreen = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
}

windowrule {
  name = windowrule-3
  float = on
  size = 800 500
  match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
  name = nvim-editor-float
  float = on
  size = 1100 750
  center = on
  # Cor da borda personalizada (opcional)
  border_color = rgb(ff00ff)
  match:class = ^(nvim_floating)$
}

# Workspace rules — dual monitor: HDMI-A-1 (ultrawide) = 1-10, eDP-1 (notebook) = 11-20
workspace = 1,  monitor:HDMI-A-1
workspace = 2,  monitor:HDMI-A-1
workspace = 3,  monitor:HDMI-A-1
workspace = 4,  monitor:HDMI-A-1
workspace = 5,  monitor:HDMI-A-1
workspace = 6,  monitor:HDMI-A-1
workspace = 7,  monitor:HDMI-A-1
workspace = 8,  monitor:HDMI-A-1
workspace = 9,  monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
workspace = 11, monitor:eDP-1
workspace = 12, monitor:eDP-1
workspace = 13, monitor:eDP-1
workspace = 14, monitor:eDP-1
workspace = 15, monitor:eDP-1
workspace = 16, monitor:eDP-1
workspace = 17, monitor:eDP-1
workspace = 18, monitor:eDP-1
workspace = 19, monitor:eDP-1
workspace = 20, monitor:eDP-1
