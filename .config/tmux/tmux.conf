set-option -g default-command "/bin/zsh --login"

unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on

set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# Indexar janelas e panes a partir de 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g status-position top

# Navegação de panes (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Splits intuitivos mantendo o diretório atual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_date_time_text " %H:%M  %d/%m"

run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

set -g status-right-length 150
set -g status-left-length 100

# Esquerda: sessão atual
set -g status-left "#{E:@catppuccin_status_session}"

# Direita: app + hora + data + uptime
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run '~/.config/tmux/plugins/tpm/tpm'
