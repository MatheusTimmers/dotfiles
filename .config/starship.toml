format = """
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$python\
$rust\
$c\
$java\
$lua\
$cmd_duration\
$line_break\
$character"""

# Diretório — só o nome da pasta atual
[directory]
style            = "bold blue"
format           = "[$path]($style) "
truncation_length = 1
truncate_to_repo  = false

# Git branch — ícone + nome
[git_branch]
symbol = " "
style  = "bold mauve"
format = "on [$symbol$branch]($style) "

# Git status — [!?+] igual à imagem
[git_status]
style     = "bold red"
format    = "([$all_status$ahead_behind]($style) )"
modified  = "!"
untracked = "?"
staged    = "+"
deleted   = "✘"
renamed   = "»"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"

# Linguagens
[golang]
symbol = "🐻 "
style  = "bold teal"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style  = "bold green"
format = "via [$symbol$version]($style) "

[python]
symbol = " "
style  = "bold yellow"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style  = "bold peach"
format = "via [$symbol$version]($style) "

[c]
symbol = " "
style  = "bold sapphire"
format = "via [$symbol$version]($style) "

[java]
symbol = " "
style  = "bold red"
format = "via [$symbol$version]($style) "

[lua]
symbol = " "
style  = "bold blue"
format = "via [$symbol$version]($style) "

# Duração do comando — só mostra se > 2s
[cmd_duration]
min_time          = 2000
style             = "bold yellow"
format            = "took [$duration]($style) "

# Prompt
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
